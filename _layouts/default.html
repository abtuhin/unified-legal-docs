<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.app %}{{ page.title }} · {{ page.app }}{% else %}{{ page.title | default: site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.app %}{{ page.title }} for {{ page.app }}{% else %}{{ site.description }}{% endif %}">
  {% if site.url and site.url != "" %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      &copy; {{ site.time | date: "%Y" }} {{ site.owner }}
      {% if site.contact_email %} · <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>{% endif %}
    </div>
  </footer>
</body>
</html>
